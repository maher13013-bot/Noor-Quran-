<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b2c"><title>نور القرآن</title>
<style>
:root{--g:#123b2c;--g2:#1e5b40;--gold:#d7b45a;--bg:#fbf8ef;--ink:#20352b;--muted:#718076}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial}header{background:linear-gradient(135deg,#0d2e22,#1e5b40);color:white;text-align:center;padding:25px 12px;border-bottom:4px solid var(--gold)}.logo{font-size:34px;font-weight:800;color:#f3d77f}.sub{color:#e7eadf}nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:13px;background:white;position:sticky;top:0;z-index:3;box-shadow:0 3px 12px #20352b12}button{font:inherit;cursor:pointer}nav button,.btn{border:1px solid #d9dfd7;background:white;color:var(--g);padding:10px 15px;border-radius:999px;font-weight:700}nav button.active,.primary{background:var(--g);color:white}main{max-width:950px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid #e6e4d9;border-radius:19px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #193d2a0a}h2{margin:0 0 13px;color:var(--g)}.intro{text-align:center;padding:25px 14px}.intro p,.muted{color:var(--muted);line-height:1.8}input{width:100%;padding:12px;border:1px solid #d7ded6;border-radius:12px;font:inherit;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.surah{display:flex;align-items:center;gap:12px;text-align:right;width:100%;padding:13px;border:1px solid #e6e4d9;background:white;border-radius:14px;color:var(--ink)}.num{background:#f5efd9;color:#80651f;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}.surah small{display:block;color:var(--muted);margin-top:3px}.ayah{padding:17px 7px;border-bottom:1px solid #eee8d8;font-size:23px;line-height:2.1;text-align:justify}.ayahno{color:#a17d25;font-size:15px}.cardtext{font-size:19px;line-height:2;padding:13px 0;border-bottom:1px solid #eee8d8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions button{padding:7px 11px;border:1px solid #d9dfd7;background:white;color:var(--g);border-radius:10px}.hidden{display:none!important}audio{width:100%;margin:12px 0}.notice{background:#fff8df;padding:12px;border-radius:12px;color:#6c571d}footer{text-align:center;padding:22px;color:var(--muted);font-size:13px}
</style></head><body>
<header><div class="logo">☾ نور القرآن</div><div class="sub">سكينةٌ للقلب ونورٌ للحياة</div></header>
<nav><button class="active" data-tab="quran">القرآن الكريم</button><button data-tab="adhkar">الأذكار</button><button data-tab="duas">الأدعية</button><button data-tab="favorites">المفضلة ★</button></nav>
<main>
<section id="quran" class="tab"><div class="panel intro"><h2>بسم الله الرحمن الرحيم</h2><p>اقرأ القرآن الكريم واستمع إلى التلاوة واحفظ ما تحب في مفضلتك.</p><input id="search" placeholder="ابحث عن اسم السورة"><div id="status" class="muted">جارٍ تحميل السور...</div></div><div id="surahList" class="grid"></div><div id="reader" class="panel hidden"><button class="btn" id="back">العودة للسور ←</button><h2 id="surahTitle" style="margin-top:14px"></h2><div id="ayahs"></div><audio id="player" controls class="hidden"></audio><div id="readerStatus" class="muted"></div></div></section>
<section id="adhkar" class="tab hidden"><div class="panel"><h2>الأذكار</h2><p class="muted">أذكار مختارة للتذكير.</p><div id="adhkarList"></div></div></section>
<section id="duas" class="tab hidden"><div class="panel"><h2>الأدعية</h2><p class="muted">أدعية قرآنية ونبوية مختارة.</p><div id="duasList"></div></div></section>
<section id="favorites" class="tab hidden"><div class="panel"><h2>المفضلة</h2><div id="favList"></div></div></section>
</main><footer>نور القرآن · يتطلب تحميل السور والتلاوة اتصالاً بالإنترنت</footer>
<script>
const API='https://api.alquran.cloud/v1', $=x=>document.getElementById(x);let surahs=[],favs=JSON.parse(localStorage.getItem('noor-favs')||'[]');
function save(){localStorage.setItem('noor-favs',JSON.stringify(favs))}
function showTab(n){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==n));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));if(n==='favorites')renderFavs()}
document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));
async function load(){try{let r=await fetch(API+'/surah'),j=await r.json();if(j.code!==200)throw 0;surahs=j.data;renderSurahs();$('status').textContent='اختر سورة للقراءة والاستماع'}catch(e){$('status').textContent='تعذّر تحميل السور. تحقق من الإنترنت وحدّث الصفحة.'}}
function renderSurahs(q=''){$('surahList').innerHTML='';surahs.filter(s=>s.name.includes(q)||s.englishName.toLowerCase().includes(q.toLowerCase())).forEach(s=>{let b=document.createElement('button');b.className='surah';b.innerHTML=`<span class="num">${s.number}</span><span><b>${s.name}</b><small>${s.englishName} · ${s.numberOfAyahs} آية · ${s.revelationType==='Meccan'?'مكية':'مدنية'}</small></span>`;b.onclick=()=>openSurah(s);$('surahList').append(b)})}
$('search').oninput=e=>renderSurahs(e.target.value.trim());$('back').onclick=()=>{$('reader').classList.add('hidden');$('surahList').classList.remove('hidden');$('search').classList.remove('hidden')};
async function openSurah(s){$('reader').classList.remove('hidden');$('surahList').classList.add('hidden');$('search').classList.add('hidden');$('surahTitle').textContent=s.name+' — '+s.englishName;$('ayahs').innerHTML='';$('readerStatus').textContent='جارٍ تحميل الآيات...';$('player').classList.add('hidden');try{let [q,a]=await Promise.all([fetch(API+'/surah/'+s.number+'/quran-uthmani').then(r=>r.json()),fetch(API+'/surah/'+s.number+'/ar.alafasy').then(r=>r.json())]);$('ayahs').innerHTML=q.data.ayahs.map(x=>`<div class="ayah">${x.text} <span class="ayahno">۞ ${x.numberInSurah}</span></div>`).join('');let first=a.data.ayahs[0]?.audio;if(first){$('player').src=first;$('player').classList.remove('hidden');$('readerStatus').textContent='التلاوة بصوت مشاري العفاسي. مشغل الصوت يبدأ من الآية الأولى.'}else $('readerStatus').textContent='تم تحميل الآيات.'}catch(e){$('readerStatus').textContent='تعذّر تحميل السورة. حاول مجدداً.'}}
const adh=[['ذكر الصباح','أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.','مرة واحدة'],['ذكر الصباح','اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.','مرة واحدة'],['ذكر المساء','أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.','مرة واحدة'],['ذكر عام','سبحان الله وبحمده.','100 مرة'],['ذكر عام','أستغفر الله وأتوب إليه.','100 مرة'],['ذكر عام','لا حول ولا قوة إلا بالله.','يُكرر'] ,['بعد الصلاة','اللهم أعني على ذكرك وشكرك وحسن عبادتك.','مرة واحدة']];
const dua=[['دعاء قرآني','رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.','البقرة: 201'],['دعاء قرآني','رَبِّ زِدْنِي عِلْمًا.','طه: 114'],['دعاء قرآني','رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.','آل عمران: 8'],['دعاء قرآني','رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ.','الحشر: 10'],['دعاء مأثور','اللهم إني أسألك العفو والعافية في الدنيا والآخرة.','دعاء نبوي']];
function renderCards(id,arr,type){$(id).innerHTML=arr.map((x,i)=>{let key=type+':'+i,active=favs.some(f=>f.key===key);return `<div class="cardtext"><b>${x[0]}</b><div>${x[1]}</div><small class="muted">${x[2]}</small><div class="actions"><button onclick="copyText(${JSON.stringify(x[1])})">نسخ</button><button onclick="toggleFav('${type}',${i})">${active?'★ محفوظ':'☆ أضف للمفضلة'}</button></div></div>`}).join('')}
function toggleFav(type,i){let arr=type==='adhkar'?adh:dua,key=type+':'+i;favs=favs.some(f=>f.key===key)?favs.filter(f=>f.key!==key):[...favs,{key,title:arr[i][0],text:arr[i][1]}];save();renderCards(type==='adhkar'?'adhkarList':'duasList',arr,type)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('تم النسخ')).catch(()=>alert(t));else alert(t)}
function renderFavs(){$('favList').innerHTML=favs.length?favs.map(f=>`<div class="cardtext"><b>${f.title}</b><div>${f.text}</div><button class="btn" onclick="removeFav('${f.key}')">إزالة</button></div>`).join(''):'<p class="muted">لم تحفظ أي عناصر بعد.</p>'}
function removeFav(k){favs=favs.filter(f=>f.key!==k);save();renderFavs()}
renderCards('adhkarList',adh,'adhkar');renderCards('duasList',dua,'duas');load();
</script></body></html>
